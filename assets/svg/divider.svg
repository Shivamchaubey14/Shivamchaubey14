<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6EDF6"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <line x1="0" y1="14" x2="1200" y2="14" stroke="url(#line)" stroke-width="1"/>
  <circle cx="0" cy="14" r="6" fill="url(#dot)">
    <animate attributeName="cx" values="200;1000;200" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="14s" repeatCount="indefinite"/>
  </circle>
</svg>
