<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="LegalAgent — an AI assistant parsing a legal document into structured reasoning nodes">
  <title>LegalAgent</title>
  <defs>
    <linearGradient id="labg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C111A"/>
      <stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11192A"/>
      <stop offset="100%" stop-color="#0D1422"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="16" fill="url(#labg)" stroke="#1A2334" stroke-width="1"/>

  <circle cx="26" cy="26" r="5" fill="#2A3650"/>
  <circle cx="44" cy="26" r="5" fill="#2A3650"/>
  <circle cx="62" cy="26" r="5" fill="#2A3650"/>
  <text x="280" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5A6B85" letter-spacing="1">legalagent · reasoning</text>
  <line x1="0" y1="48" x2="560" y2="48" stroke="#1A2334"/>

  <!-- document -->
  <rect x="48" y="80" width="180" height="220" rx="10" fill="url(#doc)" stroke="#243049"/>
  <g fill="#33415C">
    <rect x="68" y="104" width="140" height="9" rx="4"/>
    <rect x="68" y="124" width="110" height="9" rx="4"/>
    <rect x="68" y="144" width="140" height="9" rx="4"/>
    <rect x="68" y="164" width="90"  height="9" rx="4"/>
    <rect x="68" y="184" width="140" height="9" rx="4"/>
    <rect x="68" y="204" width="120" height="9" rx="4"/>
    <rect x="68" y="224" width="140" height="9" rx="4"/>
    <rect x="68" y="244" width="80"  height="9" rx="4"/>
  </g>
  <!-- scan line -->
  <rect x="56" y="96" width="164" height="14" rx="4" fill="#7DD3FC" opacity="0.18">
    <animate attributeName="y" values="96;272;96" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- flow edges -->
  <g stroke="url(#flow)" stroke-width="1.6" fill="none">
    <path d="M228 140 C 300 140, 320 110, 392 110"/>
    <path d="M228 190 C 300 190, 320 190, 392 190"/>
    <path d="M228 240 C 300 240, 320 270, 392 270"/>
  </g>
  <circle r="3" fill="#E6EDF6"><animateMotion dur="3.5s" repeatCount="indefinite" path="M228 140 C 300 140, 320 110, 392 110"/></circle>
  <circle r="3" fill="#E6EDF6"><animateMotion dur="4s" repeatCount="indefinite" path="M228 240 C 300 240, 320 270, 392 270"/></circle>

  <!-- reasoning nodes -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#C7D3E6">
    <g><rect x="392" y="92"  width="116" height="36" rx="8" fill="#141C2E" stroke="#2C3A57"/><text x="450" y="114" text-anchor="middle">Clauses</text></g>
    <g><rect x="392" y="172" width="116" height="36" rx="8" fill="#141C2E" stroke="#2C3A57"/><text x="450" y="194" text-anchor="middle">Obligations</text></g>
    <g><rect x="392" y="252" width="116" height="36" rx="8" fill="#141C2E" stroke="#2C3A57"/><text x="450" y="274" text-anchor="middle">Risks</text></g>
  </g>
</svg>
