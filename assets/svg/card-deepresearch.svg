<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-label="DeepResearch — agentic AI research assistant. Django, Kafka, Qdrant, Claude. Python.">
  <defs>
    <radialGradient id="drGlow" cx="88%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="drG" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .t  { font-family:'Space Grotesk','Sora','Segoe UI',Helvetica,Arial,sans-serif; }
    .m  { font-family:'JetBrains Mono','Fira Code',Consolas,monospace; }
    .np { transform-box: fill-box; transform-origin: center; animation: np 2.8s ease-in-out infinite; }
    @keyframes np { 0%,100% { transform: scale(1); opacity:.7; } 50% { transform: scale(1.5); opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .imp { display:none; } }
  </style>

  <rect x="1" y="1" width="458" height="188" rx="15" fill="#0D1117" stroke="#22D3EE" stroke-opacity=".38"/>
  <rect x="1" y="1" width="458" height="188" rx="15" fill="url(#drGlow)"/>

  <!-- faint synapse constellation -->
  <g stroke="#22D3EE" stroke-opacity=".18" fill="none">
    <path id="drP" d="M300,26 L356,52 L410,30 M356,52 L392,84 L438,66"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="300" cy="26" r="2" opacity=".4"/>
    <circle class="np" cx="356" cy="52" r="2.4" opacity=".6"/>
    <circle cx="410" cy="30" r="2" opacity=".4"/>
    <circle cx="392" cy="84" r="1.8" opacity=".35"/>
    <circle class="np" cx="438" cy="66" r="2" opacity=".5" style="animation-delay:1.2s"/>
  </g>
  <g class="imp" filter="url(#drG)">
    <circle r="1.8" fill="#67E8F9"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#drP"/></animateMotion></circle>
  </g>

  <!-- module badge -->
  <rect x="22" y="20" width="8" height="8" fill="#22D3EE"/>
  <text x="38" y="28" class="m" font-size="9.5" letter-spacing="2" fill="#22D3EE">MODULE 01 · REASONING ENGINE</text>

  <!-- title + repo -->
  <text x="22" y="62" class="t" font-size="23" font-weight="700" fill="#E6F1FF">DeepResearch</text>
  <text x="22" y="80" class="m" font-size="10" fill="#5B6B80">Shivamchaubey14/research-agent</text>

  <!-- description -->
  <text x="22" y="104" class="t" font-size="12" fill="#9FB0C7">An autonomous agent that plans, searches, verifies and</text>
  <text x="22" y="120" class="t" font-size="12" fill="#9FB0C7">streams back a cited research report — live, step by step.</text>

  <!-- tech chips -->
  <g class="m" font-size="9.5">
    <rect x="22"  y="134" width="52" height="18" rx="9" fill="#101A24" stroke="#1B3A47"/><text x="48"  y="146" text-anchor="middle" fill="#7DD3FC">Django</text>
    <rect x="80"  y="134" width="46" height="18" rx="9" fill="#101A24" stroke="#1B3A47"/><text x="103" y="146" text-anchor="middle" fill="#7DD3FC">Kafka</text>
    <rect x="132" y="134" width="52" height="18" rx="9" fill="#101A24" stroke="#1B3A47"/><text x="158" y="146" text-anchor="middle" fill="#7DD3FC">Qdrant</text>
    <rect x="190" y="134" width="52" height="18" rx="9" fill="#101A24" stroke="#1B3A47"/><text x="216" y="146" text-anchor="middle" fill="#7DD3FC">Claude</text>
    <rect x="248" y="134" width="40" height="18" rx="9" fill="#101A24" stroke="#1B3A47"/><text x="268" y="146" text-anchor="middle" fill="#7DD3FC">K8s</text>
  </g>

  <!-- footer -->
  <line x1="22" y1="162" x2="438" y2="162" stroke="#16202D"/>
  <circle cx="27" cy="175" r="4.5" fill="#3572A5"/>
  <text x="38" y="179" class="m" font-size="10" fill="#9FB0C7">Python</text>
  <text x="438" y="179" text-anchor="end" class="m" font-size="10" fill="#22D3EE">⌬ open module →</text>
</svg>
