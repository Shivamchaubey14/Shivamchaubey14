<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Shivam Kumar Chaubey — Designing Intelligent Software Systems">
  <title>Shivam Kumar Chaubey — Designing Intelligent Software Systems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="50%" stop-color="#0D1320"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#7DD3FC" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1B2436" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="440" fill="url(#glow)"/>

  <!-- drifting network nodes -->
  <g stroke="#2A3650" stroke-width="1" opacity="0.55">
    <line x1="170" y1="120" x2="320" y2="220"/>
    <line x1="320" y1="220" x2="200" y2="330"/>
    <line x1="1040" y1="110" x2="900" y2="210"/>
    <line x1="900" y1="210" x2="1010" y2="330"/>
    <line x1="320" y1="220" x2="900" y2="210" opacity="0.25"/>
  </g>
  <g fill="#7DD3FC">
    <circle cx="170" cy="120" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="220" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;0.4;1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="330" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="110" r="2.5" fill="#A78BFA"><animate attributeName="opacity" values="0.5;1;0.5" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="210" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="330" r="3" fill="#A78BFA"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- monogram -->
  <g transform="translate(600 96)">
    <rect x="-30" y="-30" width="60" height="60" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="0" y="9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#E6EDF6" letter-spacing="1">SC</text>
  </g>

  <!-- headline -->
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#F2F6FC" letter-spacing="0.5">Designing Intelligent Software Systems</text>

  <!-- accent underline draw -->
  <line x1="480" y1="252" x2="720" y2="252" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="240" stroke-dashoffset="240">
    <animate attributeName="stroke-dashoffset" from="240" to="0" dur="2.2s" fill="freeze"/>
  </line>

  <!-- positioning -->
  <text x="600" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#9FB0C7" letter-spacing="0.6">Backend architecture &#8901; AI systems &#8901; Product engineering</text>

  <!-- scroll cue -->
  <g transform="translate(600 372)" fill="#5A6B85">
    <text x="0" y="0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#4A5A74">EXPLORE</text>
    <g transform="translate(0 14)">
      <circle cx="0" cy="0" r="2.4">
        <animate attributeName="cy" values="0;8;0" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
