<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" role="img" aria-label="End of neural stream — connection persists.">
  <defs>
    <radialGradient id="fbg" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity=".5"/>
    </linearGradient>
    <filter id="fg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .tw { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.12; } 50% { opacity:.7; } }
    .hb { transform-box: fill-box; transform-origin: center; animation: hb 3s ease-in-out infinite; }
    @keyframes hb { 0%,100% { transform: scale(1); opacity:.85; } 50% { transform: scale(1.18); opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .pulse { display:none; } }
  </style>

  <rect width="1200" height="160" fill="url(#fbg)"/>

  <!-- converging synapses -->
  <g fill="none">
    <path id="f1" d="M80,30 C300,45 450,70 585,92" stroke="url(#fadeL)" stroke-width="1"/>
    <path id="f2" d="M160,120 C340,110 460,100 585,96" stroke="url(#fadeL)" stroke-width="1"/>
    <path id="f3" d="M1120,30 C900,45 750,70 615,92" stroke="url(#fadeR)" stroke-width="1"/>
    <path id="f4" d="M1040,120 C860,110 740,100 615,96" stroke="url(#fadeR)" stroke-width="1"/>
  </g>
  <g class="pulse" filter="url(#fg)">
    <circle r="2.2" fill="#67E8F9"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#f1"/></animateMotion></circle>
    <circle r="2.2" fill="#7DD3FC"><animateMotion dur="4.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#f2"/></animateMotion></circle>
    <circle r="2.2" fill="#C4B5FD"><animateMotion dur="4.2s" begin=".6s" repeatCount="indefinite"><mpath href="#f3"/></animateMotion></circle>
    <circle r="2.2" fill="#A78BFA"><animateMotion dur="4.8s" begin="1.8s" repeatCount="indefinite"><mpath href="#f4"/></animateMotion></circle>
  </g>

  <!-- terminal node -->
  <circle class="hb" cx="600" cy="94" r="12" fill="none" stroke="#7DD3FC" stroke-opacity=".5" stroke-width="1"/>
  <circle cx="600" cy="94" r="5" fill="#E6F1FF" filter="url(#fg)"/>

  <text x="600" y="130" text-anchor="middle" font-size="10" letter-spacing="4" fill="#64748B">END OF NEURAL STREAM &#183; CONNECTION PERSISTS</text>
  <text x="600" y="148" text-anchor="middle" font-size="9" letter-spacing="2" fill="#3B4A5E">designed &amp; engineered by the central intelligence &#183; shivam kumar chaubey</text>

  <g fill="#67E8F9">
    <circle class="tw" cx="120" cy="60" r="1.3"/><circle class="tw" cx="340" cy="35" r="1.2" style="animation-delay:1.2s"/>
    <circle class="tw" cx="880" cy="40" r="1.3" style="animation-delay:2.1s"/><circle class="tw" cx="1080" cy="70" r="1.2" style="animation-delay:.7s"/>
  </g>
  <g fill="#A78BFA">
    <circle class="tw" cx="230" cy="95" r="1.2" style="animation-delay:1.8s"/><circle class="tw" cx="990" cy="100" r="1.3" style="animation-delay:2.6s"/>
  </g>
</svg>
