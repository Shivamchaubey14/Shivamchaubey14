<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="AlgoScope — animated algorithm visualizer rendering an array being sorted">
  <title>AlgoScope</title>
  <defs>
    <linearGradient id="asbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C111A"/>
      <stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#3B82C4"/>
    </linearGradient>
    <linearGradient id="barAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C5CD6"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="16" fill="url(#asbg)" stroke="#1A2334" stroke-width="1"/>

  <!-- window chrome -->
  <circle cx="26" cy="26" r="5" fill="#2A3650"/>
  <circle cx="44" cy="26" r="5" fill="#2A3650"/>
  <circle cx="62" cy="26" r="5" fill="#2A3650"/>
  <text x="280" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5A6B85" letter-spacing="1">algoscope · quicksort</text>
  <line x1="0" y1="48" x2="560" y2="48" stroke="#1A2334"/>

  <!-- bars -->
  <g>
    <rect x="60"  y="120" width="34" height="180" rx="4" fill="url(#bar)"><animate attributeName="height" values="180;90;180" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="120;210;120" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="108" y="170" width="34" height="130" rx="4" fill="url(#bar)"><animate attributeName="height" values="130;220;130" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="170;80;170" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="156" y="90"  width="34" height="210" rx="4" fill="url(#barAlt)"><animate attributeName="height" values="210;150;210" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="90;150;90" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="204" y="200" width="34" height="100" rx="4" fill="url(#bar)"><animate attributeName="height" values="100;240;100" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="200;60;200" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="252" y="140" width="34" height="160" rx="4" fill="url(#bar)"><animate attributeName="height" values="160;110;160" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="140;190;140" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="300" y="100" width="34" height="200" rx="4" fill="url(#barAlt)"><animate attributeName="height" values="200;130;200" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="100;170;100" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="348" y="180" width="34" height="120" rx="4" fill="url(#bar)"><animate attributeName="height" values="120;200;120" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="180;100;180" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="396" y="150" width="34" height="150" rx="4" fill="url(#bar)"><animate attributeName="height" values="150;90;150" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="150;210;150" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="444" y="110" width="34" height="190" rx="4" fill="url(#bar)"><animate attributeName="height" values="190;230;190" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="110;70;110" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="492" y="210" width="34" height="90"  rx="4" fill="url(#barAlt)"><animate attributeName="height" values="90;170;90" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="210;130;210" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="40" y1="300" x2="520" y2="300" stroke="#1A2334"/>
</svg>
