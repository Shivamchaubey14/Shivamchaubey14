<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-label="Core telemetry: 1,080 contributions in the past year, 967 commits in the past year, 95 pull requests all time, 49 public repositories. Last sync July 2026.">
  <defs>
    <filter id="stG" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .t  { font-family:'Space Grotesk','Sora','Segoe UI',Helvetica,Arial,sans-serif; }
    .m  { font-family:'JetBrains Mono','Fira Code',Consolas,monospace; }
    .ekg { stroke-dasharray: 340 60; animation: ekg 5s linear infinite; }
    @keyframes ekg { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    .hp { animation: hp 2.4s ease-in-out infinite; }
    @keyframes hp { 0%,100% { opacity:.9; } 50% { opacity:.3; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <rect x="1" y="1" width="498" height="208" rx="15" fill="#0D1117" stroke="#1F2A3A"/>

  <!-- header -->
  <circle class="hp" cx="26" cy="26" r="4" fill="#22D3EE" filter="url(#stG)"/>
  <text x="38" y="30" class="m" font-size="11.5" letter-spacing="2.5" fill="#22D3EE">CORE TELEMETRY</text>
  <text x="478" y="30" text-anchor="end" class="m" font-size="8.5" fill="#5B6B80">last sync · 2026-07</text>
  <line x1="22" y1="42" x2="478" y2="42" stroke="#16202D"/>

  <!-- stat tiles · 2 × 2 -->
  <g>
    <rect x="24"  y="58" width="3" height="40" rx="1.5" fill="#22D3EE"/>
    <text x="38" y="84"  class="t" font-size="27" font-weight="700" fill="#E6F1FF">1,080</text>
    <text x="38" y="100" class="m" font-size="8.5" letter-spacing="1.5" fill="#64748B">CONTRIBUTIONS · PAST YEAR</text>
  </g>
  <g>
    <rect x="264" y="58" width="3" height="40" rx="1.5" fill="#A78BFA"/>
    <text x="278" y="84"  class="t" font-size="27" font-weight="700" fill="#E6F1FF">967</text>
    <text x="278" y="100" class="m" font-size="8.5" letter-spacing="1.5" fill="#64748B">COMMITS · PAST YEAR</text>
  </g>
  <g>
    <rect x="24"  y="116" width="3" height="40" rx="1.5" fill="#60A5FA"/>
    <text x="38" y="142" class="t" font-size="27" font-weight="700" fill="#E6F1FF">95</text>
    <text x="38" y="158" class="m" font-size="8.5" letter-spacing="1.5" fill="#64748B">PULL REQUESTS · ALL TIME</text>
  </g>
  <g>
    <rect x="264" y="116" width="3" height="40" rx="1.5" fill="#67E8F9"/>
    <text x="278" y="142" class="t" font-size="27" font-weight="700" fill="#E6F1FF">49</text>
    <text x="278" y="158" class="m" font-size="8.5" letter-spacing="1.5" fill="#64748B">PUBLIC REPOSITORIES</text>
  </g>

  <!-- impulse waveform -->
  <path class="ekg" d="M22,188 L120,188 L132,188 L140,174 L148,198 L156,182 L164,188 L268,188 L278,178 L288,196 L296,188 L478,188"
        fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-opacity=".75" filter="url(#stG)"/>
</svg>
