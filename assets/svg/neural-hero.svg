<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Space Grotesk','Sora','Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Shivam Kumar Chaubey — central intelligence of a living neural network. Full-stack engineer evolving into AI engineer, agentic systems and LLM specialist.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="45%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="synL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="synR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family:'JetBrains Mono','Fira Code',Consolas,monospace; }
    .tw1, .tw2, .tw3 { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation-duration: 4.6s; animation-delay: 1.1s; }
    .tw3 { animation-duration: 5.8s; animation-delay: 2.3s; }
    @keyframes tw { 0%,100% { opacity:.12; } 50% { opacity:.85; } }
    .rot-slow  { transform-box: fill-box; transform-origin: center; animation: rot 60s linear infinite; }
    .rot-rev   { transform-box: fill-box; transform-origin: center; animation: rot 90s linear infinite reverse; }
    .rot-orbit { transform-box: fill-box; transform-origin: center; animation: rot 24s linear infinite; }
    .rot-orbit2{ transform-box: fill-box; transform-origin: center; animation: rot 38s linear infinite reverse; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .breathe { transform-box: fill-box; transform-origin: center; animation: br 5s ease-in-out infinite; }
    @keyframes br { 0%,100% { transform: scale(1); opacity:.9; } 50% { transform: scale(1.06); opacity:1; } }
    .blink { animation: bl 1.1s steps(2,start) infinite; }
    @keyframes bl { to { visibility: hidden; } }
    .statusdot { animation: sd 2s ease-in-out infinite; }
    @keyframes sd { 0%,100% { opacity:1; } 50% { opacity:.25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pulse { display: none; }
    }
  </style>

  <rect width="1200" height="560" fill="url(#bg)"/>

  <!-- ambient data particles -->
  <g fill="#67E8F9">
    <circle class="tw1" cx="80"  cy="70"  r="1.4"/><circle class="tw2" cx="180" cy="430" r="1.1"/>
    <circle class="tw3" cx="260" cy="120" r="1.6"/><circle class="tw1" cx="340" cy="500" r="1.2"/>
    <circle class="tw2" cx="430" cy="60"  r="1.3"/><circle class="tw3" cx="520" cy="510" r="1.5"/>
    <circle class="tw1" cx="700" cy="55"  r="1.2"/><circle class="tw2" cx="780" cy="495" r="1.4"/>
    <circle class="tw3" cx="880" cy="90"  r="1.6"/><circle class="tw1" cx="960" cy="460" r="1.1"/>
    <circle class="tw2" cx="1060" cy="130" r="1.5"/><circle class="tw3" cx="1130" cy="380" r="1.3"/>
    <circle class="tw1" cx="150" cy="260" r="1.2"/><circle class="tw2" cx="1090" cy="250" r="1.2"/>
    <circle class="tw3" cx="620" cy="40" r="1.1"/><circle class="tw1" cx="90" cy="500" r="1.3"/>
  </g>
  <g fill="#A78BFA">
    <circle class="tw2" cx="120" cy="160" r="1.3"/><circle class="tw3" cx="300" cy="320" r="1.1"/>
    <circle class="tw1" cx="480" cy="470" r="1.4"/><circle class="tw2" cx="740" cy="470" r="1.2"/>
    <circle class="tw3" cx="920" cy="330" r="1.3"/><circle class="tw1" cx="1120" cy="60" r="1.4"/>
    <circle class="tw2" cx="60" cy="350" r="1.1"/><circle class="tw3" cx="1010" cy="520" r="1.2"/>
  </g>

  <!-- ══════════ LEFT SYNAPTIC BRANCH ══════════ -->
  <g stroke-width="1" fill="none">
    <path id="pL1" d="M170,140 C300,150 380,220 452,258" stroke="url(#synL)"/>
    <path id="pL2" d="M120,285 C260,285 350,282 440,281" stroke="url(#synL)"/>
    <path id="pL3" d="M170,430 C300,415 380,345 452,306" stroke="url(#synL)"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="170" cy="140" r="5" fill="#0D1117" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="120" cy="285" r="5" fill="#0D1117" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="170" cy="430" r="5" fill="#0D1117" stroke="#A78BFA" stroke-width="1.5"/>
  </g>
  <g class="mono" font-size="11" letter-spacing="2" fill="#7DD3FC">
    <text x="185" y="136">BACKEND SYSTEMS</text>
    <text x="135" y="281" fill="#93C5FD">DISTRIBUTED INFRA</text>
    <text x="185" y="444" fill="#C4B5FD">FULL-STACK ENGINEERING</text>
  </g>
  <g class="pulse" fill="#67E8F9" filter="url(#glow)">
    <circle r="2.6"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#pL1"/></animateMotion></circle>
    <circle r="2.6" fill="#93C5FD"><animateMotion dur="4.2s" begin="1s" repeatCount="indefinite"><mpath href="#pL2"/></animateMotion></circle>
    <circle r="2.6" fill="#C4B5FD"><animateMotion dur="3.8s" begin="2s" repeatCount="indefinite"><mpath href="#pL3"/></animateMotion></circle>
  </g>

  <!-- ══════════ RIGHT SYNAPTIC BRANCH ══════════ -->
  <g stroke-width="1" fill="none">
    <path id="pR1" d="M1030,140 C900,150 820,220 748,258" stroke="url(#synR)"/>
    <path id="pR2" d="M1080,285 C940,285 850,282 760,281" stroke="url(#synR)"/>
    <path id="pR3" d="M1030,430 C900,415 820,345 748,306" stroke="url(#synR)"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="1030" cy="140" r="5" fill="#0D1117" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="1080" cy="285" r="5" fill="#0D1117" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="1030" cy="430" r="5" fill="#0D1117" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
  <g class="mono" font-size="11" letter-spacing="2" text-anchor="end">
    <text x="1015" y="136" fill="#C4B5FD">AGENTIC AI</text>
    <text x="1065" y="281" fill="#7DD3FC">LLM ENGINEERING</text>
    <text x="1015" y="444" fill="#93C5FD">RAG &#183; RETRIEVAL &#183; EVALS</text>
  </g>
  <g class="pulse" fill="#C4B5FD" filter="url(#glow)">
    <circle r="2.6"><animateMotion dur="3.9s" begin=".5s" repeatCount="indefinite"><mpath href="#pR1"/></animateMotion></circle>
    <circle r="2.6" fill="#67E8F9"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#pR2"/></animateMotion></circle>
    <circle r="2.6" fill="#93C5FD"><animateMotion dur="4.4s" begin="2.4s" repeatCount="indefinite"><mpath href="#pR3"/></animateMotion></circle>
  </g>

  <!-- ══════════ CENTRAL NEURAL CORE ══════════ -->
  <circle cx="600" cy="282" r="210" fill="url(#coreGlow)"/>

  <!-- expanding ripple rings -->
  <g fill="none" stroke="#22D3EE">
    <circle cx="600" cy="282" r="120" stroke-opacity="0.5">
      <animate attributeName="r" values="120;190" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="282" r="120" stroke="#A78BFA" stroke-opacity="0.5">
      <animate attributeName="r" values="120;190" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rotating instrument rings -->
  <g class="rot-slow" fill="none">
    <circle cx="600" cy="282" r="150" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 10"/>
  </g>
  <g class="rot-rev" fill="none">
    <circle cx="600" cy="282" r="172" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="1 7"/>
  </g>
  <circle cx="600" cy="282" r="122" fill="none" stroke="#7DD3FC" stroke-opacity="0.35" stroke-width="1"/>

  <!-- orbiting satellite neurons -->
  <g class="rot-orbit">
    <circle cx="600" cy="132" r="4" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="600" cy="432" r="3" fill="#A78BFA" filter="url(#glow)"/>
  </g>
  <g class="rot-orbit2">
    <circle cx="428" cy="282" r="3.4" fill="#E6F1FF" filter="url(#glow)"/>
    <circle cx="772" cy="282" r="2.6" fill="#60A5FA" filter="url(#glow)"/>
  </g>

  <!-- core identity -->
  <g text-anchor="middle">
    <text x="600" y="222" class="mono breathe" font-size="11" letter-spacing="6" fill="#67E8F9" filter="url(#glow)">&#9672; CENTRAL INTELLIGENCE &#9672;</text>
    <text x="600" y="272" font-size="38" font-weight="700" letter-spacing="3" fill="#E6F1FF" filter="url(#glowBig)">SHIVAM KUMAR</text>
    <text x="600" y="316" font-size="38" font-weight="700" letter-spacing="10" fill="#E6F1FF" filter="url(#glowBig)">CHAUBEY</text>
    <text x="600" y="348" class="mono" font-size="12" letter-spacing="2" fill="#9FB0C7">FULL-STACK &#183; BACKEND &#183; APPLIED AI ENGINEER</text>
    <text x="600" y="372" class="mono" font-size="11" letter-spacing="1" fill="#7DD3FC">building agentic systems that stay traceable to their sources</text>
  </g>

  <!-- ══════════ HUD CHROME ══════════ -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="36" y="36" fill="#67E8F9">NEURAL-OS v5.0</text>
    <text x="36" y="52" fill="#64748B">SESSION &#183; github.com/Shivamchaubey14</text>
    <rect class="blink" x="338" y="44" width="6" height="9" fill="#67E8F9"/>
    <text x="1164" y="36" text-anchor="end" fill="#A78BFA">CONSCIOUSNESS &#183; ONLINE</text>
    <text x="1164" y="52" text-anchor="end" fill="#64748B">MODE &#183; AUTONOMOUS</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="1">
    <path d="M24,24 h14 M24,24 v14"/><path d="M1176,24 h-14 M1176,24 v14"/>
    <path d="M24,536 h14 M24,536 v-14"/><path d="M1176,536 h-14 M1176,536 v-14"/>
  </g>

  <!-- status bar -->
  <g class="mono" font-size="10" letter-spacing="2">
    <circle class="statusdot" cx="42" cy="522" r="3.5" fill="#34D399" filter="url(#glow)"/>
    <text x="54" y="526" fill="#94A3B8">SYSTEM STATUS: <tspan fill="#34D399">ONLINE</tspan> &#183; ALL NEURONS RESPONDING</text>
    <text x="1160" y="526" text-anchor="end" fill="#64748B">REPOSITORIES = MEMORIES &#183; COMMITS = ELECTRICAL IMPULSES</text>
  </g>
  <text x="600" y="546" text-anchor="middle" class="mono tw1" font-size="10" letter-spacing="4" fill="#475569">&#9661; SCROLL TO ENTER THE NETWORK &#9661;</text>
</svg>
