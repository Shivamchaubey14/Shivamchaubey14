<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-label="Language cortex — share of code by bytes across all repositories: Python 52.4%, JavaScript 19.4%, HTML 16.1%, CSS 4.9%, TypeScript 3.3%, SCSS 2.9%, other 1.1%.">
  <defs>
    <filter id="lgG" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .t  { font-family:'Space Grotesk','Sora','Segoe UI',Helvetica,Arial,sans-serif; }
    .m  { font-family:'JetBrains Mono','Fira Code',Consolas,monospace; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hp { animation: hp 2.4s ease-in-out infinite; }
    @keyframes hp { 0%,100% { opacity:.9; } 50% { opacity:.3; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <rect x="1" y="1" width="498" height="208" rx="15" fill="#0D1117" stroke="#1F2A3A"/>

  <!-- header -->
  <circle class="hp" cx="26" cy="26" r="4" fill="#A78BFA" filter="url(#lgG)"/>
  <text x="38" y="30" class="m" font-size="11.5" letter-spacing="2.5" fill="#A78BFA">LANGUAGE CORTEX</text>
  <text x="478" y="30" text-anchor="end" class="m" font-size="8.5" fill="#5B6B80">by bytes · all repos</text>
  <line x1="22" y1="42" x2="478" y2="42" stroke="#16202D"/>

  <!-- rotating outer tick ring (decorative) -->
  <g class="ring">
    <circle cx="110" cy="124" r="80" fill="none" stroke="#1F2A3A" stroke-width="1" stroke-dasharray="2 9"/>
  </g>

  <!-- donut · 2px surface gaps between segments · C = 389.56 -->
  <g transform="rotate(-90 110 124)" stroke-width="25" fill="none">
    <circle cx="110" cy="124" r="62" stroke="#0891B2" stroke-dasharray="201.55 188.01" stroke-dashoffset="-1.25"/>
    <circle cx="110" cy="124" r="62" stroke="#8B5CF6" stroke-dasharray="73.07 316.49"  stroke-dashoffset="-205.30"/>
    <circle cx="110" cy="124" r="62" stroke="#D97706" stroke-dasharray="60.10 329.46"  stroke-dashoffset="-280.87"/>
    <circle cx="110" cy="124" r="62" stroke="#DB2777" stroke-dasharray="16.59 372.97"  stroke-dashoffset="-343.47"/>
    <circle cx="110" cy="124" r="62" stroke="#3B82F6" stroke-dasharray="10.16 379.40"  stroke-dashoffset="-362.56"/>
    <circle cx="110" cy="124" r="62" stroke="#059669" stroke-dasharray="8.91 380.65"   stroke-dashoffset="-375.22"/>
    <circle cx="110" cy="124" r="62" stroke="#64748B" stroke-dasharray="1.63 387.93"   stroke-dashoffset="-386.63"/>
  </g>

  <!-- center hero -->
  <text x="110" y="122" text-anchor="middle" class="t" font-size="23" font-weight="700" fill="#E6F1FF">52.4%</text>
  <text x="110" y="140" text-anchor="middle" class="m" font-size="9" letter-spacing="1.5" fill="#64748B">PYTHON CORE</text>

  <!-- legend · direct labels with shares -->
  <g class="t" font-size="11.5">
    <circle cx="232" cy="60"  r="4" fill="#0891B2"/><text x="244" y="64"  fill="#C9D6E8">Python</text><text     x="478" y="64"  text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">52.4%</text>
    <circle cx="232" cy="81"  r="4" fill="#8B5CF6"/><text x="244" y="85"  fill="#C9D6E8">JavaScript</text><text x="478" y="85"  text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">19.4%</text>
    <circle cx="232" cy="102" r="4" fill="#D97706"/><text x="244" y="106" fill="#C9D6E8">HTML</text><text       x="478" y="106" text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">16.1%</text>
    <circle cx="232" cy="123" r="4" fill="#DB2777"/><text x="244" y="127" fill="#C9D6E8">CSS</text><text        x="478" y="127" text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">4.9%</text>
    <circle cx="232" cy="144" r="4" fill="#3B82F6"/><text x="244" y="148" fill="#C9D6E8">TypeScript</text><text x="478" y="148" text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">3.3%</text>
    <circle cx="232" cy="165" r="4" fill="#059669"/><text x="244" y="169" fill="#C9D6E8">SCSS</text><text       x="478" y="169" text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">2.9%</text>
    <circle cx="232" cy="186" r="4" fill="#64748B"/><text x="244" y="190" fill="#C9D6E8">Other</text><text      x="478" y="190" text-anchor="end" class="m" font-size="10.5" fill="#E6F1FF">1.1%</text>
  </g>
</svg>
